<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>Flashcard Giáo lý Hôn nhân Công giáo</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#253347;background:#f7f6f2}*{box-sizing:border-box}body{margin:0;padding:22px 16px 56px}.app{max-width:760px;margin:auto}h1{font-size:clamp(24px,4.6vw,34px);margin:4px 0 8px;text-align:center;color:#1f3659}.sub{text-align:center;color:#64748b;margin:0 0 22px}.toolbar{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:15px 0}.btn{border:1px solid #cbd5e1;background:#fff;color:#243654;border-radius:12px;padding:11px 15px;font-size:15px;font-weight:650;cursor:pointer}.btn:active{transform:scale(.98)}.primary{background:#214c85;color:white;border-color:#214c85}.muted{color:#64748b;font-size:13px;text-align:center}.progress{display:flex;justify-content:space-between;align-items:center;color:#64748b;font-size:13px;margin:14px 0 8px}.bar{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#23866b;transition:width .2s}.card{border:1px solid #dde3ea;background:white;border-radius:22px;box-shadow:0 12px 30px #23304712;padding:clamp(22px,5vw,38px);min-height:345px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;user-select:none}.topic{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#60728f;font-weight:750;margin-bottom:25px;text-align:center}.front{font-size:clamp(23px,4vw,31px);font-weight:750;text-align:center;line-height:1.4;color:#162e4c}.answer{font-size:clamp(16px,2.9vw,19px);line-height:1.75;user-select:text}.answer p{margin:0 0 12px}.answer ul{margin:3px 0 0;padding-left:24px}.answer li{padding-bottom:8px}.key{font-weight:750;text-decoration-color:#c23c36;text-decoration-thickness:2px;text-underline-offset:3px;color:#a32622}.hint{text-align:center;color:#8190a3;margin-top:22px;font-size:13px}.footer{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px}.footer button{flex:1}.marks{display:flex;gap:10px;margin-top:14px}.marks button{flex:1}.known{background:#e3f5ed;border-color:#80c9a7;color:#147653}.missed{background:#fff0ec;border-color:#f7aaa1;color:#b63f32}.small{font-size:13px}u{text-decoration-skip-ink:auto}@media(max-width:500px){.card{min-height:410px;padding:23px 20px}.footer{gap:7px}.footer button{padding:10px 6px;font-size:14px}}@media(prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s}.card:hover{box-shadow:0 18px 38px #23304719}}</style></head><body><main class="app"><h1>Giáo lý Hôn nhân Công giáo</h1><p class="sub">27 flashcard · Đáp án nguyên văn · Gạch chân ý chính</p><div class="toolbar"><button class="btn" id="shuffle">🔀 Trộn thẻ</button><button class="btn" id="reset">↺ Học lại từ đầu</button></div><div class="progress"><span id="counter"></span><span id="stats"></span></div><div class="bar"><div id="bar"></div></div><section class="card" id="card" tabindex="0" role="button" aria-label="Lật thẻ flashcard"><div class="topic" id="topic"></div><div id="face"></div><div class="hint" id="hint"></div></section><div class="footer"><button class="btn" id="prev">← Trước</button><button class="btn primary" id="flip">Xem đáp án</button><button class="btn" id="next">Tiếp →</button></div><div class="marks"><button class="btn missed" id="missed">✕ Chưa thuộc</button><button class="btn known" id="known">✓ Đã thuộc</button></div><p class="muted">Chạm vào thẻ để lật. Tiến độ lưu trên trình duyệt của từng người, không đồng bộ giữa hai máy.</p></main><script>
const cards=[{"topic": "Ơn gọi hôn nhân trong chương trình của TC", "front": "Hôn nhân là gì?", "back": "<p>T. Hôn nhân là <strong class=\"key\"><u>giao ước ký kết giữa một người nam và một người nữ<\/u><\/strong>, với đầy đủ <strong class=\"key\"><u>tự do ưng thuận và ý thức trách nhiệm<\/u><\/strong>, để trở thành vợ chồng.<\/p>"}, {"topic": "Ơn gọi hôn nhân trong chương trình của TC", "front": "Ai đã lập nên hôn nhân?", "back": "<p>T. <strong class=\"key\"><u>Chính Thiên Chúa đã lập nên hôn nhân<\/u><\/strong>, khi dựng nên loài người có nam có nữ, và mời gọi họ <strong class=\"key\"><u>sống yêu thương<\/u><\/strong>.<\/p>"}, {"topic": "Ơn gọi hôn nhân trong chương trình của TC", "front": "Yếu tố căn bản của hôn nhân là gì?", "back": "<p>T. Yếu tố căn bản của hôn nhân chính là <strong class=\"key\"><u>tình yêu<\/u><\/strong> vì Hôn nhân được <strong class=\"key\"><u>thiết lập do tình yêu<\/u><\/strong> và mục đích cuối cùng của Hôn nhân cũng chính là <strong class=\"key\"><u>tình yêu<\/u><\/strong>.<\/p>"}, {"topic": "Ơn gọi hôn nhân trong chương trình của TC", "front": "Hôn nhân có những mục đích nào?", "back": "<p>T. Hôn nhân có hai mục đích này:<\/p><ul><li>Một là <strong class=\"key\"><u>yêu thương và giúp đỡ lẫn nhau<\/u><\/strong>.<\/li><li>Hai là <strong class=\"key\"><u>cộng tác với Thiên Chúa<\/u><\/strong> trong việc <strong class=\"key\"><u>sinh sản và giáo dục con cái<\/u><\/strong>.<\/li><\/ul>"}, {"topic": "Hôn nhân Công giáo", "front": "Hôn nhân Công giáo có những đặc tính nào?", "back": "<p>T. Hôn nhân Công giáo có hai đặc tính này:<\/p><ul><li>Một là <strong class=\"key\"><u>đơn nhất<\/u><\/strong>, nghĩa là <strong class=\"key\"><u>một vợ một chồng<\/u><\/strong>.<\/li><li>Hai là <strong class=\"key\"><u>bất khả phân ly<\/u><\/strong>, nghĩa là <strong class=\"key\"><u>trung thành yêu thương nhau trọn đời<\/u><\/strong>.<\/li><\/ul>"}, {"topic": "Hôn nhân Công giáo", "front": "Bí tích Hôn phối ban cho vợ chồng những ơn nào?", "back": "<p>T. Bí tích Hôn phối ban ơn giúp các đôi vợ chồng <strong class=\"key\"><u>yêu thương nhau, như Đức Kitô đã yêu thương Hội Thánh<\/u><\/strong>, <strong class=\"key\"><u>kiện toàn tình yêu tự nhiên<\/u><\/strong>, <strong class=\"key\"><u>củng cố sự hiệp nhất bất khả phân ly<\/u><\/strong> và <strong class=\"key\"><u>thánh hoá họ trong đời sống siêu nhiên<\/u><\/strong>.<\/p>"}, {"topic": "Giáo luật về Bí tích Hôn phối", "front": "Để Bí tích Hôn phối thành sự phải có những điều kiện nào?", "back": "<p>T. Phải có bốn điều kiện này:<\/p><ul><li>Một là <strong class=\"key\"><u>một nam một nữ đã rửa tội<\/u><\/strong>.<\/li><li>Hai là <strong class=\"key\"><u>có tự do kết hôn<\/u><\/strong>, không bị ép buộc cũng không bị ngăn trở bởi luật tự nhiên hoặc luật Hội Thánh.<\/li><li>Ba là phải <strong class=\"key\"><u>bày tỏ sự ưng thuận kết hôn<\/u><\/strong>.<\/li><li>Bốn là <strong class=\"key\"><u>cử hành theo thể thức của Hội Thánh<\/u><\/strong>.<\/li><\/ul>"}, {"topic": "Hôn nhân khác tôn giáo", "front": "Tôn giáo có vai trò nào trong đời sống hôn nhân và gia đình?", "back": "<p>T. Tôn giáo có một <strong class=\"key\"><u>vai trò rất quan trọng<\/u><\/strong> trong đời sống hôn nhân và gia đình, vì <strong class=\"key\"><u>ảnh hưởng đến lối suy nghĩ, cách xử sự và việc giáo dục con cái<\/u><\/strong>.<\/p>"}, {"topic": "Hôn nhân khác tôn giáo", "front": "Hội Thánh có cho phép chuẩn để kết hôn với người ngoài Công giáo không?", "back": "<p>T. <strong class=\"key\"><u>Có<\/u><\/strong> với những điều kiện sau đây:<\/p><ul><li>Một là hai người phải <strong class=\"key\"><u>hiểu biết và chấp nhận những mục đích và đặc tính của hôn nhân<\/u><\/strong>.<\/li><li>Hai là bên Công giáo phải <strong class=\"key\"><u>cam kết giữ đức tin của mình<\/u><\/strong>, bảo đảm cho con cái được <strong class=\"key\"><u>rửa tội và giáo dục trong Hội Thánh Công giáo<\/u><\/strong>.<\/li><li>Ba là phải <strong class=\"key\"><u>cho bên không Công giáo biết rõ những điều ấy<\/u><\/strong>.<\/li><\/ul>"}, {"topic": "Hôn nhân khác tôn giáo", "front": "Nếu lập gia đình với người khác đạo, bên Công giáo cần phải sống thế nào?", "back": "<p>T. Nếu lập gia đình với người khác đạo, bên Công giáo cần phải <strong class=\"key\"><u>sống tốt đạo<\/u><\/strong> và <strong class=\"key\"><u>trở nên chứng nhân Tin mừng cho con cái và người bạn đời<\/u><\/strong>.<\/p>"}, {"topic": "Các thủ tục và nghi lễ Hôn phối", "front": "Vì sao Hội Thánh buộc các tín hữu cử hành hôn phối theo nghi thức của Hội Thánh?", "back": "<p>T. Hội Thánh buộc các tín hữu cử hành hôn phối theo nghi thức của Hội Thánh vì bốn lý do này:<\/p><ul><li>Một là vì Bí tích Hôn phối là <strong class=\"key\"><u>hành vi phụng vụ<\/u><\/strong>.<\/li><li>Hai là vì Hôn nhân là <strong class=\"key\"><u>một bậc sống trong Hội Thánh<\/u><\/strong>.<\/li><li>Ba là vì cần phải có <strong class=\"key\"><u>sự chắc chắn về sự kết hôn<\/u><\/strong>, nên buộc phải có <strong class=\"key\"><u>người làm chứng<\/u><\/strong>.<\/li><li>Bốn là vì việc <strong class=\"key\"><u>công khai bày tỏ sự ưng thuận<\/u><\/strong> sẽ giúp hai vợ chồng <strong class=\"key\"><u>sống chung thuỷ với nhau<\/u><\/strong>.<\/li><\/ul>"}, {"topic": "Tình yêu vợ chồng", "front": "Tình yêu vợ chồng có những đặc tính nào?", "back": "<p>T. Tình yêu vợ chồng có những đặc tính này là:<\/p><ul><li>Một là <strong class=\"key\"><u>kết hợp nên một<\/u><\/strong>.<\/li><li>Hai là <strong class=\"key\"><u>trao hiến trọn vẹn<\/u><\/strong>.<\/li><li>Ba là <strong class=\"key\"><u>chung thủy suốt đời<\/u><\/strong>.<\/li><li>Bốn là <strong class=\"key\"><u>đón nhận con cái<\/u><\/strong>.<\/li><\/ul>"}, {"topic": "Tình yêu vợ chồng", "front": "Vợ chồng có những bổn phận nào?", "back": "<p>T. Người nam được mời gọi chu toàn <strong class=\"key\"><u>bổn phận làm chồng và làm cha<\/u><\/strong>; người nữ được mời gọi chu toàn <strong class=\"key\"><u>bổn phận làm vợ và làm mẹ<\/u><\/strong>.<\/p>"}, {"topic": "Tình yêu vợ chồng", "front": "Khuôn mẫu của tình yêu vợ chồng là gì?", "back": "<p>T. Khuôn mẫu của tình yêu vợ chồng chính là <strong class=\"key\"><u>sự kết hợp giữa Đức Kitô và Hội Thánh<\/u><\/strong>.<\/p>"}, {"topic": "Tính dục và hôn nhân", "front": "Vợ chồng cần nắm vững những nguyên tắc luân lý nào trong đời sống tính dục?", "back": "<p>T. Vợ chồng cần nắm vững những nguyên tắc luân lý sau đây:<\/p><ul><li>Một là các <strong class=\"key\"><u>hành vi tính dục được thực hiện trong khuôn khổ hôn nhân<\/u><\/strong> đều <strong class=\"key\"><u>chính đáng và cao quý<\/u><\/strong>.<\/li><\/ul>"}, {"topic": "Tính dục và hôn nhân", "front": "Có những tội nào xúc phạm đến phẩm giá hôn nhân?", "back": "<p>T. Có những tội này là: <strong class=\"key\"><u>ngoại tình, ly dị, đa phu, đa thê, loạn luân, đồng tính luyến ái và tự do sống chung như vợ chồng<\/u><\/strong>.<\/p>"}, {"topic": "Triển nở trong tình yêu", "front": "Vợ chồng phải làm gì để tình yêu luôn được triển nở?", "back": "<p>T. Vợ chồng cần phải:<\/p><ul><li>Một là <strong class=\"key\"><u>tôn trọng lẫn nhau<\/u><\/strong>.<\/li><li>Hai là <strong class=\"key\"><u>hy sinh cho nhau<\/u><\/strong>.<\/li><li>Ba là <strong class=\"key\"><u>đối thoại, chia sẻ tâm tình với nhau<\/u><\/strong>.<\/li><li>Bốn là <strong class=\"key\"><u>dành thời giờ cho nhau<\/u><\/strong>.<\/li><li>Năm là <strong class=\"key\"><u>nói với nhau những lời âu yếm<\/u><\/strong>.<\/li><li>Sáu là <strong class=\"key\"><u>làm tròn bổn phận vợ chồng<\/u><\/strong>.<\/li><li>Bảy là <strong class=\"key\"><u>cầu nguyện với nhau và cho nhau<\/u><\/strong>.<\/li><\/ul>"}, {"topic": "Giải quyết những xung đột", "front": "Vợ chồng cần có thái độ nào khi xảy ra xung đột?", "back": "<p>T. Vợ chồng cần giữ những nguyên tắc này:<\/p><ul><li>Một là <strong class=\"key\"><u>tự chủ<\/u><\/strong>.<\/li><li>Hai là <strong class=\"key\"><u>có thiện chí muốn giải quyết<\/u><\/strong>.<\/li><li>Ba là <strong class=\"key\"><u>đối thoại với nhau<\/u><\/strong>.<\/li><li>Bốn là <strong class=\"key\"><u>chấp nhận khuyết điểm của mình<\/u><\/strong>.<\/li><li>Năm là <strong class=\"key\"><u>cố gắng hàn gắn và làm lành<\/u><\/strong>.<\/li><li>Sáu là <strong class=\"key\"><u>nhờ người làm trung gian hoà giải<\/u><\/strong>.<\/li><li>Bảy là <strong class=\"key\"><u>cầu nguyện để biết cách giải quyết theo tinh thần của Chúa<\/u><\/strong>.<\/li><\/ul>"}, {"topic": "Sự phân ly vợ chồng", "front": "Hội Thánh có thể cho ly thân không?", "back": "<p>T. <strong class=\"key\"><u>Trong một số trường hợp đặc biệt<\/u><\/strong>, Hội Thánh <strong class=\"key\"><u>có thể cho ly thân<\/u><\/strong>.<\/p>"}, {"topic": "Sự phân ly vợ chồng", "front": "Những người đã ly thân có được phép kết hôn với người khác nữa không?", "back": "<p>T. <strong class=\"key\"><u>Không<\/u><\/strong>, vì họ <strong class=\"key\"><u>vẫn là vợ chồng trước mặt Thiên Chúa<\/u><\/strong>.<\/p>"}, {"topic": "Sự phân ly vợ chồng", "front": "Hội Thánh có thái độ nào đối với những đôi vợ chồng đã ly dị và tái hôn?", "back": "<p>T. Trung thành với lời dạy của Đức Kitô, Hội Thánh <strong class=\"key\"><u>không chấp nhận việc ly dị<\/u><\/strong>, và cũng <strong class=\"key\"><u>không công nhận hôn nhân mới là thành sự<\/u><\/strong>.<\/p>"}, {"topic": "Sự phân ly vợ chồng", "front": "Hội Thánh mong ước gì nơi họ?", "back": "<p>T. Hội Thánh ân cần mời gọi họ <strong class=\"key\"><u>lắng nghe Lời Chúa, tham dự thánh lễ, cầu nguyện, thực thi bác ái, giáo dục con cái trong đức tin và sớm hoán cải<\/u><\/strong>.<\/p>"}, {"topic": "Sinh con có trách nhiệm", "front": "Sinh sản có trách nhiệm nghĩa là gì?", "back": "<p>T. Sinh sản có trách nhiệm nghĩa là khi sinh con, cha mẹ phải lo <strong class=\"key\"><u>nuôi dưỡng, giáo dục, để chúng nên người<\/u><\/strong>. Bởi vậy, vợ chồng cần <strong class=\"key\"><u>suy xét cẩn thận<\/u><\/strong> để có <strong class=\"key\"><u>quyết định đúng đắn và phù hợp trong việc sinh con<\/u><\/strong>.<\/p>"}, {"topic": "Giáo dục con cái", "front": "Vì sao giáo dục con cái là bổn phận quan trọng nhất của cha mẹ?", "back": "<p>T. Vì cha mẹ được <strong class=\"key\"><u>cộng tác với Thiên Chúa trong việc tạo nên những con người mới<\/u><\/strong>, những người con của Thiên Chúa. <strong class=\"key\"><u>Bổn phận này không ai thay thế được<\/u><\/strong>.<\/p>"}, {"topic": "Giáo dục con cái", "front": "Phải giáo dục con cái những gì?", "back": "<p>T. Ngay từ lúc con cái còn tấm bé, cha mẹ đã phải cho chúng một <strong class=\"key\"><u>nền giáo dục nhân bản<\/u><\/strong>, đồng thời còn phải cho chúng một <strong class=\"key\"><u>nền giáo dục Công giáo<\/u><\/strong>, giúp chúng trở thành những <strong class=\"key\"><u>Kitô hữu trưởng thành<\/u><\/strong>.<\/p>"}, {"topic": "Giáo dục con cái", "front": "Làm sao để việc giáo dục đạt kết quả tốt?", "back": "<p>T. Để đạt kết quả tốt trong việc giáo dục con cái, cha mẹ cần phải:<\/p><ul><li>Một là <strong class=\"key\"><u>đồng tâm nhất trí với nhau<\/u><\/strong>.<\/li><li>Hai là <strong class=\"key\"><u>nêu gương trước những gì mình muốn truyền đạt<\/u><\/strong>.<\/li><li>Ba là <strong class=\"key\"><u>tạo bầu khí yêu thương trong gia đình<\/u><\/strong>.<\/li><li>Bốn là <strong class=\"key\"><u>tìm hiểu con cái<\/u><\/strong>.<\/li><li>Năm là <strong class=\"key\"><u>kiên nhẫn trong việc giáo dục<\/u><\/strong>.<\/li><li>Sáu là <strong class=\"key\"><u>cầu nguyện cho con cái<\/u><\/strong>.<\/li><\/ul>"}, {"topic": "Đạo hiếu", "front": "Con cái biểu lộ lòng hiếu thảo với cha mẹ như thế nào?", "back": "<p>T. Con cái bày tỏ lòng hiếu thảo qua những việc sau đây:<\/p><ul><li>Một là khi các ngài còn sống thì phải <strong class=\"key\"><u>yêu mến, tôn kính, vâng lời, chăm sóc và giúp đỡ<\/u><\/strong>.<\/li><li>Hai là khi các ngài qua đời phải <strong class=\"key\"><u>lo an táng, cầu nguyện và xin lễ<\/u><\/strong>.<\/li><li>Ba là anh chị em trong nhà cần <strong class=\"key\"><u>hoà thuận yêu thương nhau, noi gương cha mẹ để nên lành thánh<\/u><\/strong>.<\/li><\/ul>"}];
const storage='giao-ly-hon-nhan-flashcards-full-v1';
let saved={};try{saved=JSON.parse(localStorage.getItem(storage)||'{}')||{}}catch(e){}
let order=Array.from({length:cards.length},(_,i)=>i),pos=0,flipped=false;
const el=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(storage,JSON.stringify(saved))}catch(e){}}
function render(){const idx=order[pos],c=cards[idx];el('topic').textContent=c.topic;el('face').className=flipped?'answer':'front';if(flipped){el('face').innerHTML=c.back}else{el('face').textContent=c.front}el('hint').textContent=flipped?'Chạm để xem lại câu hỏi':'Chạm để xem câu trả lời';el('flip').textContent=flipped?'Xem câu hỏi':'Xem đáp án';el('counter').textContent=`Thẻ ${pos+1} / ${cards.length}`;const count=Object.keys(saved).filter(k=>saved[k]==='known').length,miss=Object.keys(saved).filter(k=>saved[k]==='missed').length;el('stats').textContent=`✓ ${count} thuộc · ✕ ${miss} chưa thuộc`;el('bar').style.width=`${100*count/cards.length}%`;el('known').style.outline=saved[idx]==='known'?'2px solid #16815c':'none';el('missed').style.outline=saved[idx]==='missed'?'2px solid #c13f36':'none'}
function flip(){flipped=!flipped;render()}
function move(d){pos=(pos+d+cards.length)%cards.length;flipped=false;render()}
function mark(value){saved[order[pos]]=value;persist();move(1)}
el('card').addEventListener('click',e=>{if(e.target.closest('a'))return;flip()});el('card').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});el('flip').onclick=flip;el('prev').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('known').onclick=()=>mark('known');el('missed').onclick=()=>mark('missed');el('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;flipped=false;render()};el('reset').onclick=()=>{if(confirm('Xóa toàn bộ đánh dấu đã thuộc/chưa thuộc và học lại từ đầu?')){saved={};persist();order=Array.from({length:cards.length},(_,i)=>i);pos=0;flipped=false;render()}};render();
</script></body></html>
